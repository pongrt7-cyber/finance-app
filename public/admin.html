<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - สมุดเงินของฉัน</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <h1>Admin Dashboard</h1>
      <a href="/" class="icon-btn">← กลับ</a>
    </div>
  </header>

  <main id="app">
    <section class="card">
        <div class="card-head"><p class="card-title">สรุปภาพรวมระบบ</p></div>
        <div class="stat-grid">
          <div class="stat-cell">
            <p class="stat-label">รายจ่ายรวม</p>
            <p class="stat-value mono" id="adminTotalExpenses">฿0</p>
          </div>
          <div class="stat-cell">
            <p class="stat-label">รายรับรวม</p>
            <p class="stat-value mono" id="adminTotalIncome">฿0</p>
          </div>
        </div>
    </section>

    <section class="card">
        <div class="card-head"><p class="card-title">ความปลอดภัย & การจัดการ</p></div>
        <button class="btn-primary" style="background: var(--ink-red);" onclick="resetData()">ล้างข้อมูลทั้งหมด (Reset)</button>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
